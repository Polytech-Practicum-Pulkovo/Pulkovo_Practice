x-db-env: &db-env
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}

services:
  bd:
    build: ./BD
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  notifications:
    build: ./services/notifications
    environment:
      <<: *db-env
    depends_on:
      bd:
        condition: service_healthy
    ports:
      - "8003:8000"
    networks:
      - backend

  ai-generation:
    build: ./services/ai-generation
    environment:
      CATALOGS_DIR: /app/catalogs
      LEARNING_MATERIALS_DIR: /app/learning_materials
      GIGACHAT_CLIENT_ID: ${GIGACHAT_CLIENT_ID}
      GIGACHAT_CLIENT_SECRET: ${GIGACHAT_CLIENT_SECRET}
      GIGACHAT_AUTH_URL: ${GIGACHAT_AUTH_URL}
      GIGACHAT_CHAT_URL: ${GIGACHAT_CHAT_URL}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE}
      GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL}
    volumes:
      - ./catalogs:/app/catalogs:ro
      - ./catalogs/learning_materials:/app/learning_materials:ro
    ports:
      - "8004:8000"
    networks:
      - backend

  personal-data:
    build: ./services/personal-data
    environment:
      <<: *db-env
      NOTIFICATIONS_URL: http://notifications:8000
    depends_on:
      bd:
        condition: service_healthy
      notifications:
        condition: service_started
    ports:
      - "8001:8000"
    networks:
      - backend

  progress-loader:
    build: ./services/progress-loader
    environment:
      <<: *db-env
    depends_on:
      bd:
        condition: service_healthy
    ports:
      - "8002:8000"
    networks:
      - backend

  course-progress:
    build: ./services/course-progress
    environment:
      <<: *db-env
      NOTIFICATIONS_URL: http://notifications:8000
      AI_GENERATION_URL: http://ai-generation:8000
      CATALOGS_DIR: /app/catalogs
      LEARNING_MATERIALS_DIR: /app/learning_materials
    volumes:
      - ./catalogs:/app/catalogs:ro
      - ./catalogs/learning_materials:/app/learning_materials:ro
    depends_on:
      bd:
        condition: service_healthy
      notifications:
        condition: service_started
      ai-generation:
        condition: service_started
    ports:
      - "8005:8000"
    networks:
      - backend

  course-management:
    build: ./services/course-management
    environment:
      <<: *db-env
      AI_GENERATION_URL: http://ai-generation:8000
      LEARNING_MATERIALS_DIR: /app/learning_materials
    volumes:
      - ./catalogs/learning_materials:/app/learning_materials
    depends_on:
      bd:
        condition: service_healthy
      ai-generation:
        condition: service_started
    ports:
      - "8006:8000"
    networks:
      - backend

  frontend:
    build:
      context: ./services/frontend
      args:
        VITE_PERSONAL_DATA_URL: http://localhost:8001
        VITE_PROGRESS_LOADER_URL: http://localhost:8002
        VITE_NOTIFICATIONS_URL: http://localhost:8003
        VITE_AI_GENERATION_URL: http://localhost:8004
        VITE_COURSE_PROGRESS_URL: http://localhost:8005
        VITE_COURSE_MANAGEMENT_URL: http://localhost:8006
    depends_on:
      - personal-data
      - progress-loader
      - notifications
      - ai-generation
      - course-progress
      - course-management
    ports:
      - "3000:80"
    networks:
      - backend

networks:
  backend:

volumes:
  pgdata:
